<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Text Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main>
    <header>
      <div class="document-heading">
        <span class="app-mark" aria-hidden="true">T</span>
        <div><span class="app-name">Text Editor</span><strong id="title">Opening…</strong></div>
      </div>
      <div class="actions">
        <span id="status" role="status" aria-live="polite">Opening…</span>
        <button id="save" type="button" disabled>Save</button>
      </div>
    </header>
    <textarea id="text" aria-label="Document text" spellcheck="true" disabled></textarea>
  </main>
  <script src="editor.js"></script>
</body>
</html>

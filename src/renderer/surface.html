<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:">
  <title>CompuSync</title>
  <link rel="stylesheet" href="surface.css">
</head>
<body>
  <main id="surface" aria-label="One shared CompuSync window. Drag its top bar to move it between laptops. Move inside the desktop to bend the grid and emit particles with the shared cursor. Click the desktop to capture; Escape to release.">
    <header id="top-bar" aria-label="Shared window title bar">
      <div id="drag-handle" aria-label="Drag the shared window">
        <span class="window-mark" aria-hidden="true"><i></i><i></i></span>
        <span class="window-title">CompuSync</span>
      </div>
      <div class="window-actions">
        <button id="open-settings" type="button" aria-label="Open connection settings" title="Connection settings">Settings</button>
        <button id="close-window" type="button" aria-label="Close the shared window" title="Close shared window">Close</button>
      </div>
    </header>
    <section id="desktop" aria-label="Shared desktop">
      <canvas id="field" aria-hidden="true"></canvas>
      <div id="desktop-world">
        <section class="workspace-panel" data-desktop-interactive aria-label="Shared workspace">
          <div class="workspace-toolbar">
            <button id="import-files" type="button">Import</button>
            <button id="new-folder" type="button">New folder</button>
            <button id="rename-entry" type="button" disabled>Rename</button>
            <button id="delete-entry" type="button" disabled>Delete</button>
            <span id="host-badge">Host workspace</span>
          </div>
          <nav id="breadcrumbs" aria-label="Workspace path"></nav>
          <div id="file-grid" role="listbox" aria-label="Files and folders"></div>
          <p id="empty-workspace">Drop files here or choose Import.</p>
        </section>

        <section id="program-window" class="program-window" data-desktop-interactive aria-label="Host program" hidden>
          <header class="program-titlebar">
            <strong id="program-title">Text Editor</strong>
            <span id="program-host">Running on host</span>
            <button id="close-program" type="button" aria-label="Close program">Close</button>
          </header>
          <img id="program-frame" alt="Live host program interface" tabindex="0" draggable="false">
          <p id="program-waiting">Starting the host program…</p>
        </section>

        <div id="transfer-status" data-desktop-interactive role="status" aria-live="polite" hidden></div>
        <form id="name-dialog" class="name-dialog" data-desktop-interactive hidden>
          <label id="name-dialog-label" for="entry-name">Name</label>
          <input id="entry-name" maxlength="120" autocomplete="off" required>
          <div><button id="cancel-name" type="button">Cancel</button><button class="primary" type="submit">Save</button></div>
        </form>
      </div>
      <svg id="cursor" width="24" height="30" viewBox="0 0 24 30" aria-hidden="true" hidden><path d="M3 2 L3 23 L8.4 17.7 L12.4 27 L16.5 25.2 L12.5 16.3 L20 16 Z"/></svg>
      <div id="ripple" aria-hidden="true"></div>
    </section>
  </main>
  <script src="field.js"></script>
  <script src="desktop.js"></script>
  <script src="surface.js"></script>
</body>
</html>

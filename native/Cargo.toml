[package]
name = "compusync-native"
version = "0.3.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16", features = ["napi8"] }
napi-derive = "2.16"
once_cell = "1.20"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
strip = "symbols"

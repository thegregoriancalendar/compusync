[package]
name = "compusync-native"
version = "0.3.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16", features = ["napi8"] }
napi-derive = "2.16"
once_cell = "1.20"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10.3"
rtrb = "0.3.2"

[target.'cfg(windows)'.dependencies]
compusync-windows-audio = { path = "windows-audio" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSValue", "NSUUID"] }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
strip = "symbols"

name: Release installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: compusync-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require release publishing token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: test -n "$RELEASES_TOKEN" || { echo 'RELEASES_TOKEN is required to publish to the public compusync-releases repository.'; exit 1; }
      - name: Require a public binary release repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: test "$(gh api repos/thegregoriancalendar/compusync-releases --jq .private)" = false || { echo 'thegregoriancalendar/compusync-releases must exist and be public.'; exit 1; }

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
            command: npm run dist:win
          - os: macos-latest
            artifact: macos-installer
            command: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/verify-release-tag.cjs "${{ github.ref_name }}"
      - name: Require production signing credentials
        run: node scripts/verify-release-env.cjs "${{ runner.os }}"
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: npm run check
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: node scripts/verify-release-assets.cjs "${{ runner.os }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          repository: thegregoriancalendar/compusync-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: release-assets/*

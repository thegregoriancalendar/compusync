name: Desktop checks and builds
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build unsigned desktop artifacts
        type: boolean
        default: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run native:build
      - run: npm run native:smoke
      - run: npm run test:native
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
      - if: github.event_name == 'workflow_dispatch' && inputs.package && runner.os == 'Windows'
        run: npm run dist:win
      - if: github.event_name == 'workflow_dispatch' && inputs.package && runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: compusync-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
